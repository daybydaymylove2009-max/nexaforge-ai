[project]
name = "nexaforge-ai"
version = "2.1.0"
description = "智核万炼® NexaForge AI - 企业级硬件检测与AI训练环境评估平台"
authors = ["NexaForge AI Team <team@nexaforge.ai>"]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "nvidia-ml-py3>=7.352.0",
    "psutil>=7.2.2",
    "py3nvml>=0.2.7",
    "pythonnet>=3.0.5",
    "pywin32>=311",
    "wmi>=1.5.1",
    "websockets>=13.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cachetools>=5.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.scripts]
nexaforge = "nexaforge:main"
hardware-monitor = "hardware_server:main"

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://pypi.org/simple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
